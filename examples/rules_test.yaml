rule_files:
  - rules.yaml

evaluation_interval: 1m

tests:
  - interval: 1m
    input_series:
      - series: 'gameserver_up{game="satisfactory",name="Satisfactory"}'
        values: '0x20'
    alert_rule_test:
      - eval_time: 9m            # below for: 10m -- pins the debounce
        alertname: GameServerDown
        exp_alerts: []
      - eval_time: 11m
        alertname: GameServerDown
        exp_alerts:
          - exp_labels:
              severity: warning
              game: satisfactory
              name: Satisfactory
            exp_annotations:
              summary: "Game server Satisfactory is down"
              description: "satisfactory server \"Satisfactory\" has not answered its status query for 10m."

  - interval: 1m
    input_series:
      - series: 'gameserver_up{game="palworld",name="Palworld"}'
        values: '1x20'
    alert_rule_test:
      - eval_time: 11m
        alertname: GameServerDown
        exp_alerts: []
