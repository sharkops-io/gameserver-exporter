# cmd/gameserver-exporter/main.go now exists (added alongside this change),
# so docker/build.yml -- which Kaniko uses to build that package -- is
# included here rather than left out. Task 4 deliberately omitted it while
# the package didn't exist yet: a pipeline that is already red cannot signal
# that a NEW change broke something, and a `rules: exists:` guard is not an
# option here because the included template's jobs use `except:`, which
# GitLab rejects mixing with `rules:`.
include:
  # PUBLIC repo: a secret committed here is public the instant it's pushed,
  # and deleting it from the working tree does not remove it from history.
  - project: 'sharkops/gitlab-ci-common-config'
    ref: master
    file: 'docker/build.yml'
  - project: 'sharkops/gitlab-ci-common-config'
    ref: master
    file: 'security/secret-scan.yml'
  # lint + test. Extracted 2026-08-24 - this repo and four sibling exporters
  # carried byte-identical copies, which had already drifted (exporter-common
  # hardcoded golang:1.26 while the rest used ${GO_VERSION}).
  - project: 'sharkops/gitlab-ci-common-config'
    ref: master
    file: 'go/ci.yml'
  # promtool validation of examples/rules.yaml. The entrypoint override and the
  # `exists:` guard both live in the template now.
  - project: 'sharkops/gitlab-ci-common-config'
    ref: master
    file: 'prometheus/rules.yml'

# The included templates' jobs (build, build_release, secret-scan) supply no
# `stages:` list of their own, so this project must declare one that includes
# every stage any included or local job uses.
stages: [test, rules, build]

variables:
  # docker/build.yml (sharkops/gitlab-ci-common-config) builds with Kaniko —
  # no Docker-in-Docker. It is single-arch: whatever platform the Kaniko
  # executor itself runs on (amd64 on this org's shared runners). The
  # multi-arch (linux/amd64,linux/arm64) buildx image would need a different
  # template; amd64-only is an accepted trade for this deployment.
  REGISTRY_URL: $CI_REGISTRY
  REGISTRY_USER: $CI_REGISTRY_USER
  REGISTRY_PASSWORD: $CI_REGISTRY_PASSWORD
  IMAGE_NAME: $CI_REGISTRY_IMAGE
