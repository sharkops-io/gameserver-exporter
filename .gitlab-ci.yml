# The container build is added in the task that creates
# cmd/gameserver-exporter/main.go. Kaniko builds that package, so including
# docker/build.yml before it exists leaves `build` permanently red -- and a
# pipeline that is already red cannot signal that a NEW change broke
# something. A `rules: exists:` guard is not an option here: the included
# template's jobs use `except:`, and GitLab rejects mixing the two.
include:
  # PUBLIC repo: a secret committed here is public the instant it's pushed,
  # and deleting it from the working tree does not remove it from history.
  - project: 'sharkops/gitlab-ci-common-config'
    ref: master
    file: 'security/secret-scan.yml'

# The included template's job (secret-scan) supplies no `stages:` list of its
# own, so this project must declare one that includes every stage any
# included or local job uses.
stages: [test, rules]

variables:
  GO_VERSION: "1.26"

# Pinned, not :latest. golangci-lint refuses to run when the Go version it was
# built with is older than the one go.mod targets, so :latest turns a routine
# upstream release into a red pipeline on an unchanged commit — and, the other
# way round, silently changes the enabled linter set under you. The linter set
# itself lives in .golangci.yml so this image and a contributor's local run
# agree. Bump this tag together with GO_VERSION and go.mod's `go` directive.
lint:
  stage: test
  image: golangci/golangci-lint:v2.12.0
  script:
    - golangci-lint run --timeout 5m

test:
  stage: test
  image: golang:${GO_VERSION}
  script:
    - go test ./... -race -count=1

# promtool runs against the shipped example rules. This needs no cluster:
# `promtool test rules` synthesises its own series.
#
# prom/prometheus's default ENTRYPOINT is the `prometheus` binary itself,
# which rejects `promtool` as an unknown argument if invoked as `prometheus
# promtool ...` — hence the entrypoint override so `script:` can call
# `promtool` directly.
#
# examples/rules.yaml does not exist yet -- it ships in a later task of this
# repo's build-out -- so this job is guarded to skip rather than fail the
# pipeline red until that file lands. Remove the `rules:` block once it does.
rules:
  stage: rules
  image:
    name: prom/prometheus:latest
    entrypoint: [""]
  rules:
    - exists:
        - examples/rules.yaml
  script:
    - cd examples
    - promtool check rules rules.yaml
    - promtool test rules rules_test.yaml
